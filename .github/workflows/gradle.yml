# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      with:
        arguments: test expand

    - name: Clean space and install Ispell
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a
        sudo apt-get update && sudo apt-get install ispell -y
        df -h

    - name: Generate affix suggestions
      run: |
        iconv -f utf-8 -t cp1251 out/words_spell.txt > out/words_spell.txt.cp1251
        pwd
        TMPDIR=. findaffix -s -M 7 -l 100 out/words_spell.txt.cp1251 > out/words_spell_suffixes.txt.cp1251
        iconv -f cp1251 -t utf-8 out/words_spell_suffixes.txt.cp1251 > out/words_spell_suffixes.txt

    - uses: actions/upload-artifact@v4
      with:
        name: words_spell
        path: |
          out/dict_corp_lt.txt
          out/lemmas.txt
          out/words_spell.txt
          out/words_spell_suffixes.txt
